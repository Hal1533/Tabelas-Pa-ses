<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício - Tabelas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Exercício Tabelas</h1>

    <table border="1">
       
       
       
        <caption>6 Países Mais Populosos do Mundo (2025)</caption>
        
        <thead>
            <tr>
                <th>Posição</th>
                <th>País</th>
                <th>População (estimada)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1º</td>
                <td> <img src="img/Flag_of_India.jpg" alt=""> Índia</td>
                <td>1,43 bilhão</td>
            </tr>
            <tr>
                <td>2º</td>
                <td> <img src="img/Flag_of_the_People's_Republic_of_China.jpg" alt=""> China</td>
                <td>1,41 bilhão</td>
            </tr>
            <tr>
                <td>3º</td>
                <td> <img src="img/Flag_of_the_United_States.jpg" alt=""> Estados Unidos</td>
                <td>341 milhões</td>
            </tr>
            <tr>
                <td>4º</td>
                <td><img src="img/Flag_of_Indonesia.jpg" alt=""> Indonésia</td>
                <td>282 milhões</td>
            </tr>
            <tr>
                <td>5º</td>
                <td><img src="img/Flag_of_Pakistan.jpg" alt=""> Paquistão</td>
                <td>247 milhões</td>
            </tr>
            <tr>
                <td>6º</td>
                <td><img src="img/Flag_of_Nigeria.jpg" alt=""> Nigéria</td>
                <td>229 milhões</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Fonte: Estimativas da ONU (2025)</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
